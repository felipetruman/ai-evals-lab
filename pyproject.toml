[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evals-lab"
version = "0.1.0"
description = "Reproducible, open-source agent evaluation lab: deterministic trajectory grading"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["llm", "evaluation", "agents", "trajectory", "safety"]

[project.scripts]
evals-lab = "evals_lab.cli:main"
evals-lab-batch = "evals_lab.batch_cli:main"
evals-lab-demo = "evals_lab.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
