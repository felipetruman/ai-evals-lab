[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-evals-lab"
version = "0.11.0"
description = "Reproducible, open-source agent evaluation lab: deterministic trajectory grading"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["llm", "evaluation", "agents", "trajectory", "safety"]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.30,<2"]
collector = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]

[project.scripts]
evals-lab = "evals_lab.cli:main"
evals-lab-batch = "evals_lab.batch_cli:main"
evals-lab-demo = "evals_lab.demo:main"
evals-lab-otel-sdk = "evals_lab.otel_sdk_demo:main"
evals-lab-collector = "evals_lab.remote:main"
evals-lab-stats = "evals_lab.significance_cli:main"
evals-lab-synthetic = "evals_lab.synthetic_cli:main"
evals-lab-contamination = "evals_lab.contamination_cli:main"
evals-lab-rag = "evals_lab.rag_cli:main"
evals-lab-redteam = "evals_lab.redteam_cli:main"
evals-lab-context = "evals_lab.context_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
