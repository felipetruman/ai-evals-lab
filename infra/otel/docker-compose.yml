services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ../../reports/collector:/data:rw
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
