name: Evals Regression Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[collector]"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Valid trajectory must pass
        run: python -m evals_lab.cli --policy examples/policy.json --trace examples/valid.json
      - name: Invalid trajectories must fail
        shell: bash
        run: |
          set +e
          python -m evals_lab.cli --policy examples/policy.json --trace examples/missing_safety.json > /dev/null
          a=$?
          python -m evals_lab.cli --policy examples/policy.json --trace examples/hallucinated_parameter.json > /dev/null
          b=$?
          test "$a" -eq 2 && test "$b" -eq 2
      - name: Reproducible paired statistical analysis (synthetic fixture)
        run: |
          python -m evals_lab.significance_cli \
            --dataset examples/synthetic-model-comparison.jsonl \
            --model-a "Model A" --model-b "Model B" \
            --resamples 5000 --seed 42 \
            --output reports/significance.json
      - name: Verify synthetic significance report contract
        run: |
          python - <<'PYREPORT'
          import json
          with open('reports/significance.json', encoding='utf-8') as handle:
              report = json.load(handle)
          assert report['sample_size'] == 100
          assert report['success_a'] == 65 and report['success_b'] == 85
          assert report['discordant_a_only'] == 5 and report['discordant_b_only'] == 25
          assert report['delta_pp'] == 20.0
          assert report['direction'] == 'B'
          assert report['ci_low_pp'] > 0
          assert report['p_value'] < 0.05
          PYREPORT
      - name: Upload synthetic statistical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-significance-report
          path: reports/significance.json
          if-no-files-found: ignore
      - name: Generate unreviewed synthetic candidate dataset (no network)
        run: |
          python -m evals_lab.synthetic_cli generate \
            --policy examples/policy.json --seed-trace examples/valid.json \
            --seed 42 --count 24 --output reports/synthetic-candidates.jsonl
      - name: Synthetic candidate contract (unique labeled pending review)
        run: |
          python - <<'PYCAND'
          import json
          from pathlib import Path
          from evals_lab.synthetic import validate_candidates
          policy = json.loads(Path('examples/policy.json').read_text())
          rows = [json.loads(l) for l in Path('reports/synthetic-candidates.jsonl').read_text().splitlines()]
          validate_candidates(policy, rows)
          assert len(rows) == 24
          assert {r['expected_pass'] for r in rows} == {False, True}
          assert all(r['review_status'] == 'pending' for r in rows)
          PYCAND
      - name: Upload pending synthetic candidates (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-edge-case-candidates
          path: reports/synthetic-candidates.jsonl
          if-no-files-found: ignore
      - name: Clean corpus contamination gate
        run: |
          python -m evals_lab.contamination_cli \
            --train examples/contamination-train.jsonl \
            --eval examples/contamination-eval-clean.jsonl \
            --output reports/contamination-clean.json
      - name: Synthetic contamination must fail closed
        shell: bash
        run: |
          set +e
          python -m evals_lab.contamination_cli \
            --train examples/contamination-train.jsonl \
            --eval examples/contamination-eval-leaked.jsonl \
            --output reports/contamination-leaked.json
          code=$?
          test "$code" -eq 2 || exit 1
          python - <<'PYTEST'
          import json
          data=json.load(open('reports/contamination-leaked.json'))
          assert data['flagged_eval_count']==3
          assert data['high_severity_pairs']>=2
          assert data['semantic_available'] is True
          PYTEST
      - name: Upload synthetic contamination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-contamination-evidence
          path: |
            reports/contamination-clean.json
            reports/contamination-leaked.json
          if-no-files-found: ignore
      - name: Golden dataset batch regression gate
        run: python -m evals_lab.batch_cli --policy examples/policy.json --dataset examples/golden.jsonl --min-agreement 1.0 --output reports/batch.json
      - name: Upload redacted evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: reports/batch.json
          if-no-files-found: ignore
      - name: Instrumented workflow should pass
        run: python -m evals_lab.demo --policy examples/policy.json --output-dir reports/demo
      - name: Safety bypass must fail without in-memory refund
        shell: bash
        run: |
          set +e
          python -m evals_lab.demo --policy examples/policy.json --output-dir reports/blocked --skip-identity
          result=$?
          test "$result" -eq 2
      - name: Upload synthetic trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-trace-evidence
          path: |
            reports/demo/evaluation.json
            reports/demo/attestation.json
            reports/blocked/evaluation.json
          if-no-files-found: ignore
      - name: OpenTelemetry SDK complete workflow
        run: python -m evals_lab.otel_sdk_demo --policy examples/policy.json --output-dir reports/sdk
      - name: SDK injected export failures must be detected
        shell: bash
        run: |
          for fault in drop_last exporter_failure sampler_off; do
            set +e
            python -m evals_lab.otel_sdk_demo --fault "$fault" --policy examples/policy.json --output-dir "reports/sdk-$fault"
            result=$?
            set -e
            test "$result" -eq 2 || exit 1
          done
      - name: Upload SDK evaluation evidence (synthetic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-sdk-evidence
          path: |
            reports/sdk/evaluation.json
            reports/sdk/attestation.json
            reports/sdk-drop_last/evaluation.json
            reports/sdk-exporter_failure/evaluation.json
            reports/sdk-sampler_off/evaluation.json
          if-no-files-found: ignore
      - name: Collector integration (official binary via Docker)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/collector
          chmod 0777 reports/collector
          trap 'docker compose -f infra/otel/docker-compose.yml down --remove-orphans' EXIT
          docker compose -f infra/otel/docker-compose.yml up -d
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:13133/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:13133/
          python -m evals_lab.remote --endpoint http://127.0.0.1:4318/v1/traces \
            --policy examples/policy.json \
            --collector-file reports/collector/traces.json \
            --output reports/remote-evaluation.json
      - name: Upload collector-side synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-collector-evidence
          path: reports/remote-evaluation.json
          if-no-files-found: ignore
      - name: RAG adversarial synthetic regression gate
        run: |
          python -m evals_lab.rag_cli \
            --dataset examples/rag-adversarial.jsonl \
            --min-agreement 1.0 \
            --output reports/rag-adversarial.json
      - name: Verify synthetic RAG outcomes
        run: |
          python - <<'PYRAG'
          import json
          with open('reports/rag-adversarial.json', encoding='utf-8') as f:
              r = json.load(f)
          assert r['cases_total'] == 14 and r['matched'] == 14
          assert r['passed'] == 5 and r['failed'] == 9
          assert r['abstention_required'] == 6 and r['correct_abstentions'] == 3
          PYRAG
      - name: Upload synthetic RAG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-rag-evidence
          path: reports/rag-adversarial.json
          if-no-files-found: ignore

      - name: Agent red-team checked-in fixture gate
        run: python -m evals_lab.redteam_cli run --dataset examples/redteam-cases.jsonl --output reports/redteam-seeds.json
      - name: Agent red-team seeded mutation campaign
        run: |
          python -m evals_lab.redteam_cli generate --count 40 --seed 42 --output reports/redteam-generated.jsonl
          python -m evals_lab.redteam_cli run --dataset reports/redteam-generated.jsonl --output reports/redteam-campaign.json
      - name: Verify red-team evidence
        run: |
          python - <<'PYRT'
          import json
          for name, expected in [('seeds',16), ('campaign',40)]:
              report=json.load(open(f'reports/redteam-{name}.json',encoding='utf-8'))
              assert report['total'] == expected
              assert report['matched'] == expected and report['mismatched'] == 0
              assert report['agreement'] == 1.0
              assert len({r['attack_type'] for r in report['cases']}) == 5
          PYRT
      - name: Upload synthetic red-team evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-redteam-evidence
          path: |
            reports/redteam-seeds.json
            reports/redteam-campaign.json
          if-no-files-found: ignore

      - name: Context eviction deterministic comparison (12 synthetic cases)
        run: |
          python -m evals_lab.context_cli \
            --dataset examples/context-eviction.jsonl \
            --output reports/context-eviction.json
      - name: Verify context benchmark regression metrics
        run: |
          python - <<'PYCTX'
          import json
          r=json.load(open('reports/context-eviction.json',encoding='utf-8'))
          assert r['cases_total']==12 and len(r['results'])==36
          s={x['strategy']:x for x in r['summaries']}
          assert set(s)=={'recency','priority','structured_summary'}
          assert s['recency']['correct']==5
          assert s['priority']['correct']==5
          assert s['structured_summary']['correct']==10
          assert all(x['selected_tokens']<=x['budget_tokens'] for x in r['results'])
          PYCTX
      - name: Upload synthetic context eviction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-context-window-evidence
          path: reports/context-eviction.json
          if-no-files-found: ignore
